services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
      POSTGRES_DB: ewm_dev
    ports:
      - "5432:5432"
    volumes:
      - ewm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewm -d ewm_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ewm_db_data:
